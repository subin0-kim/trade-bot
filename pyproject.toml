[project]
name = "stock-trade-bot"
version = "0.1.0"
description = "멀티 봇 자동매매 모노레포 (KIS / Upbit)"
requires-python = ">=3.11"
dependencies = [
    "bot-scalper",
    "bot-scalper-coin",
    "bot-swing",
    "bot-coin",
    "trading-indicators",
    "strategy-kit",
    "trading-backtest",
    "trading-regime",
    "trading-dashboard",
    "broker-upbit",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
bot-scalper = { workspace = true }
bot-scalper-coin = { workspace = true }
bot-swing = { workspace = true }
bot-coin = { workspace = true }
trading-indicators = { workspace = true }
strategy-kit = { workspace = true }
trading-backtest = { workspace = true }
trading-regime = { workspace = true }
trading-dashboard = { workspace = true }
broker-upbit = { workspace = true }

[tool.uv]
package = false
